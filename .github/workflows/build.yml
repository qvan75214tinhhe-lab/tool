name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Chấp nhận license Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        run: |
          unzip -q TungTomApp.zip -d src
          cd src/TungTomApp
          sed -i "s|dependencies {|dependencies {\n    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')|" app/build.gradle
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TungTom-apk
          path: src/TungTomApp/app/build/outputs/apk/debug/*.apk
